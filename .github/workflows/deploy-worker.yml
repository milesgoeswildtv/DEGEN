name: Deploy Worker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - 'db/**'
      - 'wrangler.toml'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-worker.yml'

# Updating this workflow retriggers deployment after Cloudflare credential changes.
jobs:
  deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Verify migration release order
        run: |
          if [ -f db/migrations/0008_degen_shield.sql ] && [ ! -f db/migrations/0007_player_sessions.sql ]; then
            echo "Refusing Worker deployment: Shield migration 0008 requires player-session migration 0007 first."
            exit 1
          fi
      - name: Apply D1 schema
        run: npm run db:apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Apply D1 migrations
        run: npm run db:migrate
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Deploy Worker
        run: npm run deploy:worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
