name: CI

on:
  push:
    branches: [main, 'automation/degen/battle-turn-client-v01']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Run deterministic game tests
        run: npm test
      - name: Exercise isolated local Worker/D1 reward concurrency
        run: node tests/worker-d1-concurrency.mjs
      - name: Verify expected-turn replay on local Worker/D1
        run: node tests/worker-d1-turn-replay.mjs
      - name: Verify atomic defeat transactions on local Worker/D1
        run: node tests/worker-d1-defeat-atomic.mjs
      - name: Build web app
        run: npm run build
      - name: Validate Cloudflare Worker
        run: npm run check:worker
